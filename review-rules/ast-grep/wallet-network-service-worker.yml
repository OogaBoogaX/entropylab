id: wallet-network-service-worker
language: JavaScript
severity: warning
files: ["src/service-worker.js"]
message: "Check the destination. The offline wallet must not start a network request."
note: "Advisory: CodeRabbit comments only; nothing blocks a merge. Names outside this regex are left to the path instructions."
rule:
  all:
    - any:
        - pattern: fetch($$$ARGS)
        - pattern: $GLOBAL.fetch($$$ARGS)
        - pattern: $NAV.sendBeacon($$$ARGS)
        - pattern: $G.navigator.sendBeacon($$$ARGS)
        - pattern: import($SPEC)
        - pattern: new $GLOBAL.$CTOR($$$ARGS)
        - pattern: new $CTOR($$$ARGS)
    - not:
        all:
          - pattern: fetch(request)
          - inside:
              stopBy: end
              pattern: 'self.addEventListener("install", $HANDLER)'
constraints:
  G: { regex: '^(window|globalThis|self)$' }
  GLOBAL: { regex: '^(window|globalThis|self)$' }
  NAV: { regex: '^(navigator|(window|globalThis|self)\.navigator)$' }
  CTOR: { regex: '^(XMLHttpRequest|WebSocket|EventSource|WebTransport|RTCPeerConnection)$' }
  SPEC:
    not:
      all:
        - kind: string
        - regex: '^["'']\.\.?/'
