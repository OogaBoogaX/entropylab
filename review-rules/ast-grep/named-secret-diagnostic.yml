id: named-secret-diagnostic
language: JavaScript
severity: warning
files: ["src/**/*.js"]
ignores: ["src/js/{entropylab,psbt,vanity,qr}-wasm-b64.js"]
message: "Trace the named value. Wallet secrets must not be included in console output or error messages."
note: "Advisory: CodeRabbit comments only; nothing blocks a merge. Names outside the regex are left to the path instructions."
rule:
  any:
    - kind: identifier
      regex: '(?i)^(entropy|seed|mnemonic|passphrase|privateKey|secretKey|secret|wif|xprv)(Words|Phrase|Bytes|Hex|Text)?$'
      any:
        - inside: { matches: diagnostic-arguments }
        - inside:
            kind: template_substitution
            inside:
              kind: template_string
              inside: { matches: diagnostic-arguments }
    - pattern: $OBJ.$PROP
      inside: { matches: diagnostic-arguments }
    - pattern: $FN($$$ARGS)
      inside: { matches: diagnostic-arguments }
utils:
  diagnostic-arguments:
    kind: arguments
    inside:
      any:
        - pattern: console.$METHOD($$$ARGS)
        - pattern: new Error($$$ARGS)
        - pattern: Error($$$ARGS)
constraints:
  METHOD: { regex: '^(log|info|warn|error|debug|trace|dir|table|assert)$' }
  # The final property or callee name; the get prefix covers console.log(getMnemonic()).
  PROP: { regex: '(?i)^(get)?(entropy|seed|mnemonic|passphrase|privateKey|secretKey|secret|wif|xprv)(Words|Phrase|Bytes|Hex|Text)?$' }
  FN: { regex: '(?i)^(get)?(entropy|seed|mnemonic|passphrase|privateKey|secretKey|secret|wif|xprv)(Words|Phrase|Bytes|Hex|Text)?$' }
