id: named-secret-storage
language: JavaScript
severity: warning
files: ["src/**/*.js"]
ignores: ["src/js/{entropylab,psbt,vanity,qr}-wasm-b64.js"]
message: Trace this value. Browser preferences may persist, wallet secrets may not.
rule:
  any:
    - pattern: $STORE.setItem($KEY, $VALUE)
    - pattern: $STORE[$KEY] = $VALUE
    - pattern: $STORE.$KEY = $VALUE
constraints:
  STORE: { regex: '^((window|globalThis|self)\.)?(localStorage|sessionStorage)$' }
  VALUE:
    kind: identifier
    regex: '(?i)^(entropy|seed|mnemonic|passphrase|privateKey|secretKey|secret|wif|xprv)(Words|Phrase|Bytes|Hex|Text)?$'
