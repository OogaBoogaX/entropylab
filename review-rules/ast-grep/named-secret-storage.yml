id: named-secret-storage
language: JavaScript
severity: warning
files: ["src/**/*.js"]
ignores: ["src/js/{entropylab,psbt,vanity,qr}-wasm-b64.js"]
message: "Trace this value. Browser preferences may persist, wallet secrets may not."
note: "Advisory: CodeRabbit comments only; nothing blocks a merge. Names outside the regex are left to the path instructions."
rule:
  any:
    - pattern: $STORE.setItem($KEY, $VALUE)
    - pattern: $STORE[$KEY] = $VALUE
    - pattern: $STORE.$KEY = $VALUE
constraints:
  STORE: { regex: '^((window|globalThis|self)\.)?(localStorage|sessionStorage)$' }
  # The stored value in every spelling: bare name, member, call result, interpolation.
  VALUE:
    any:
      - kind: identifier
        regex: '(?i)^(entropy|seed|mnemonic|passphrase|privateKey|secretKey|secret|wif|xprv)(Words|Phrase|Bytes|Hex|Text)?$'
      - kind: member_expression
        has:
          kind: property_identifier
          regex: '(?i)^(entropy|seed|mnemonic|passphrase|privateKey|secretKey|secret|wif|xprv)(Words|Phrase|Bytes|Hex|Text)?$'
      - kind: call_expression
        has:
          kind: identifier
          stopBy: end
          regex: '(?i)^(entropy|seed|mnemonic|passphrase|privateKey|secretKey|secret|wif|xprv)(Words|Phrase|Bytes|Hex|Text)?$'
      - kind: template_string
        has:
          kind: identifier
          stopBy: end
          regex: '(?i)^(entropy|seed|mnemonic|passphrase|privateKey|secretKey|secret|wif|xprv)(Words|Phrase|Bytes|Hex|Text)?$'
