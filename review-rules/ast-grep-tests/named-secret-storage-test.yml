id: named-secret-storage
valid:
  - |
    // localStorage.setItem("seed", seed) is forbidden
    const s = "localStorage";
    const theme = "dark";
  - |
    localStorage.setItem("theme", "dark");
    sessionStorage.setItem("locale", "en");
  - |
    localStorage.setItem("address", publicAddress);
    const length = 12;
  - |
    localStorage.setItem("theme", getTheme());
    sessionStorage.setItem("locale", settings.getLocale());
invalid:
  - |
    localStorage.setItem("seed", seed);
  - |
    sessionStorage.setItem("mnemonic", mnemonicWords);
  - |
    localStorage.privateKey = privateKey;
  - |
    window.localStorage["wif"] = wif;
  - |
    localStorage.setItem("seed", wallet.privateKey);
  - |
    sessionStorage.setItem("mnemonic", mnemonic.join(" "));
  - |
    localStorage.setItem("seed", `seed: ${seed}`);
  - |
    localStorage.setItem("k", wallet.getPrivateKey());
  - |
    sessionStorage.setItem("k", getMnemonic());
