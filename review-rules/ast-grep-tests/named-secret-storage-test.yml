id: named-secret-storage
valid:
  - |
    // localStorage.setItem("seed", seed) is forbidden
    const s = "localStorage";
    const theme = "dark";
  - |
    localStorage.setItem("theme", "dark");
    sessionStorage.setItem("locale", "en");
  - |
    localStorage.setItem("address", publicAddress);
    const length = 12;
invalid:
  - |
    localStorage.setItem("seed", seed);
  - |
    sessionStorage.setItem("mnemonic", mnemonicWords);
  - |
    localStorage.privateKey = privateKey;
  - |
    window.localStorage["wif"] = wif;
