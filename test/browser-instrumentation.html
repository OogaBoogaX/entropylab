<script>
window.__entropyLabTest = { network: [], downloadName: "", lastBlob: null, uncaught: [] };
(() => {
  const state = window.__entropyLabTest;
  // Every error that escapes the page's own handlers: a throwing event
  // handler, a timer, a promise nobody awaited. A suite that passes while the
  // page throws behind it has not passed, so each suite's last test requires
  // this to be empty. Test bodies' own failures are caught by test() and never
  // land here. Installed before the application script, so boot is covered.
  window.addEventListener("error", (event) => {
    state.uncaught.push(String(event.error?.stack ?? event.message).split("\n").slice(0, 2).join(" "));
  });
  window.addEventListener("unhandledrejection", (event) => {
    state.uncaught.push("unhandled rejection: " + String(event.reason?.stack ?? event.reason).split("\n")[0]);
  });
  const absolute = (value) => {
    try { return new URL(value instanceof Request ? value.url : String(value), location.href).href; }
    catch { return String(value); }
  };
  const originalFetch = window.fetch.bind(window);
  window.fetch = (input, init) => {
    const entry = { type: "fetch", url: absolute(input), completed: false };
    state.network.push(entry);
    const request = originalFetch(input, init);
    request.then(
      (response) => { entry.completed = true; entry.status = response.status; },
      () => { entry.completed = true; entry.status = 0; },
    );
    return request;
  };
  const originalOpen = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function(method, url, ...rest) {
    state.network.push({ type: "xhr", url: absolute(url) });
    return originalOpen.call(this, method, url, ...rest);
  };
  const OriginalWebSocket = window.WebSocket;
  window.WebSocket = class extends OriginalWebSocket {
    constructor(url, protocols) {
      state.network.push({ type: "websocket", url: absolute(url) });
      super(url, protocols);
    }
  };
  const OriginalEventSource = window.EventSource;
  window.EventSource = class extends OriginalEventSource {
    constructor(url, options) {
      state.network.push({ type: "eventsource", url: absolute(url) });
      super(url, options);
    }
  };
  const originalSendBeacon = navigator.sendBeacon?.bind(navigator);
  if (originalSendBeacon) {
    navigator.sendBeacon = (url, data) => {
      state.network.push({ type: "beacon", url: absolute(url) });
      return originalSendBeacon(url, data);
    };
  }
  const originalCreateObjectURL = URL.createObjectURL.bind(URL);
  const originalAnchorClick = HTMLAnchorElement.prototype.click;
  URL.createObjectURL = (blob) => {
    state.lastBlob = blob;
    return originalCreateObjectURL(blob);
  };
  HTMLAnchorElement.prototype.click = function() {
    if (this.dataset.testReport === "true") return originalAnchorClick.call(this);
    if (this.download) {
      state.downloadName = this.download;
      return;
    }
    return originalAnchorClick.call(this);
  };
  window.__downloadTestReport = (filename, text) => {
    const link = document.createElement("a");
    link.dataset.testReport = "true";
    link.download = filename;
    link.href = originalCreateObjectURL(new Blob([text], { type: "text/plain" }));
    document.body.appendChild(link);
    link.click();
  };
})();
</script>
