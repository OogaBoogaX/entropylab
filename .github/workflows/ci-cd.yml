name: EntropyLab CI/CD

on:
  pull_request:
  push:
    branches: [rock]
  workflow_dispatch:
    inputs:
      ubuntu:
        description: Ubuntu
        type: boolean
        default: true
      macos:
        description: macOS
        type: boolean
        default: false
      windows:
        description: Windows
        type: boolean
        default: false
      install-firefox:
        description: Install Firefox (for macOS / Windows if not present)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

# One version for every job so setup stays in a single place.
env:
  NODE_VERSION: "22"

jobs:
  # ── Build: compile src/ first — every later job tests the generated site ──

  build:
    name: Build · compile site + Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Keyless Sigstore attestation of the exact wallet HTML (issue #58).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build static site
        run: npm run build
      - name: Generate the SHA-256 checksum manifest
        run: sha256sum entropylab.html > SHA256SUMS.txt
      - name: Attest the wallet artifact
        if: github.ref == 'refs/heads/rock' && github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: entropylab.html
      - name: Upload the checksum manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: entropylab-sha256sums
          path: SHA256SUMS.txt
          retention-days: 7
      - name: Prepare static site
        run: |
          mkdir _site
          cp entropylab.html robots.txt sitemap.xml llms.txt _site/
          cp manifest.webmanifest service-worker.js _site/
          cp entropylab.html _site/index.html
          cp -r assets _site/assets
          touch _site/.nojekyll
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          retention-days: 7

  # The secp256k1 WASM artifact (src/js/secp256k1-wasm-b64.js) is built from
  # the pinned Rust crate (secp256k1-wasm/, Cargo.lock, rust-toolchain.toml).
  # This job rebuilds it from scratch and runs its test suite against the
  # fresh build, so a stale or hand-edited committed artifact cannot hide a
  # broken crate. The artifact itself is committed back by the `artifact` job
  # after merges, same as entropylab.html: byte identity across machines is
  # not asserted because the C side compiles with the runner's clang.
  build-wasm:
    name: Build · secp256k1 WASM from Rust sources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Rebuild the WASM artifact from the Rust sources
        run: npm run build:wasm
      - name: Test the freshly built bindings
        run: node --test test/secp256k1-wasm.test.mjs

  # Resolve the OS matrix from workflow_dispatch checkboxes (defaults to Ubuntu
  # for automatic triggers or when nothing is selected).
  setup:
    name: Setup · resolve OS matrix
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      os-matrix: ${{ steps.matrix.outputs.os-matrix }}
    steps:
      - id: matrix
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            MATRIX="["
            [ "${{ inputs.ubuntu }}" == "true" ] && MATRIX="$MATRIX\"ubuntu-latest\","
            [ "${{ inputs.macos }}" == "true" ] && MATRIX="$MATRIX\"macos-latest\","
            [ "${{ inputs.windows }}" == "true" ] && MATRIX="$MATRIX\"windows-latest\","
            MATRIX="${MATRIX%,}]"
            [ "$MATRIX" == "[]" ] && MATRIX='["ubuntu-latest"]'
            echo "os-matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          else
            echo 'os-matrix=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi

  # Required aggregate gates. The deployment cannot start until both pass, so
  # it can never race ahead of a failing unit or browser test.
  test-ci:
    name: Test · complete dependency-free suite (${{ matrix.os }})
    needs: [build, setup]
    strategy:
      matrix:
        os: ${{ fromJSON(needs.setup.outputs.os-matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build static site
        run: npm run build
      - name: Run complete CI test suite
        run: npm run test:ci

  test-browser:
    name: Test · Firefox integration suite (${{ matrix.os }})
    needs: [build, setup]
    strategy:
      matrix:
        os: ${{ fromJSON(needs.setup.outputs.os-matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install Firefox (macOS)
        if: inputs.install-firefox && runner.os == 'macOS'
        run: brew install --cask firefox
      - name: Install Firefox (Windows)
        if: inputs.install-firefox && runner.os == 'Windows'
        run: choco install firefox
      - name: Build static site
        run: npm run build
      - name: Run headless Firefox tests
        run: npm run test:browser

  # ── Per-section tests: each runs in its own isolated runner, in parallel ──

  test-network:
    name: Test · network-check (network-check.js)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run network-check tests
        run: npm run test:network

  test-browser-check:
    name: Test · browser sanity checks (browser-check.js)
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build static site
        run: npm run build
      - name: Run browser-check tests
        run: npm run test:browser-check

  test-ui:
    name: Test · UI defaults (app.js, index.html, styles.css)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run UI-default tests
        run: npm run test:ui

  test-invariants:
    name: Test · repo invariants (manifest, assets, security)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run source-invariant tests
        run: npm run test:invariants

  test-descriptor:
    name: Test · descriptor QR (watch-only + multisig origins)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run descriptor tests
        run: npm run test:descriptor

  test-seedqr:
    name: Test · SeedQR encoding (locked dependencies + app)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run SeedQR tests
        run: npm run test:seedqr

  test-number-bases:
    name: Test · number-base entropy decoding
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run number-base tests
        run: npm run test:number-bases

  # ── Artifact: commit the rebuilt site after merges to rock ────────────────

  artifact:
    name: Artifact · commit rebuilt site after merge
    if: github.ref == 'refs/heads/rock' && github.event_name == 'push'
    needs: [verify, build-wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Rebuild the secp256k1 WASM artifact from the Rust sources
        run: npm run build:wasm
      - name: Build static site
        run: npm run build
      - name: Generate the SHA-256 checksum manifest
        run: sha256sum entropylab.html > SHA256SUMS.txt
      - name: Commit the generated artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f entropylab.html src/js/secp256k1-wasm-b64.js SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "Build output is unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "Rebuild site artifact [skip ci]"
          git push

  # ── Verify: independent check of the generated site artifact ──

  verify:
    name: Verify · site artifact (snapshot, manifest, assets)
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build static site
        run: npm run build
      - name: Verify site artifact
        run: npm run verify

  # ── Deploy: gated on a good build and a clean verify ──

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/rock' && github.event_name != 'pull_request'
    needs: [build, verify, test-ci, test-browser, build-wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy tested artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
