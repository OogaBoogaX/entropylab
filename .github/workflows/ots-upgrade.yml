# Upgrade a pending OpenTimestamps proof to a Bitcoin attestation.
# Does not rebuild entropylab.html, does not change checksums or CID,
# does not block Pages. A pending .ots is not a timestamp; this job is what
# makes it one. Calendars only — no Bitcoin node required to upgrade.

name: OpenTimestamps upgrade

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ots-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    name: Upgrade · complete pending OpenTimestamps proof
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: rock
          # The OTS client is third-party code; keep GITHUB_TOKEN out of
          # .git/config, where it could read it.
          persist-credentials: false
      - name: Install OpenTimestamps client
        run: |
          python3 -m venv "$RUNNER_TEMP/ots"
          "$RUNNER_TEMP/ots/bin/pip" install --disable-pip-version-check --require-hashes --no-deps --only-binary :all: -r "$GITHUB_WORKSPACE/.github/ots-requirements.txt"
      - name: Upgrade the committed proof
        id: upgrade
        run: |
          set -euo pipefail
          if [ ! -f entropylab.html.ots ]; then
            echo "No entropylab.html.ots yet; stamp job has not run."
            exit 0
          fi
          OTS="$RUNNER_TEMP/ots/bin/ots"
          # Bind the proof to this checkout before touching it: a proof left
          # on rock for bytes the tree no longer carries must never be
          # upgraded into a Bitcoin attestation and republished (audit L8).
          # The stamp job replaces a stale proof on its next run.
          ACTUAL=$(sha256sum entropylab.html | cut -d' ' -f1)
          EXISTING=$("$OTS" info entropylab.html.ots 2>/dev/null | sed -n 's/^File sha256 hash: //p' | head -1 || true)
          if [ "$EXISTING" != "$ACTUAL" ]; then
            echo "Committed proof covers ${EXISTING:-an unknown digest}; rock's entropylab.html is $ACTUAL. Not upgrading; the stamp job will replace the stale proof."
            exit 0
          fi
          # ots upgrade entropylab.html.ots — completes a pending calendar receipt.
          # It exits non-zero whenever the timestamp is still incomplete, which
          # is the ordinary state until a calendar has a block attestation.
          # That is a "come back tomorrow", not a failure, so do not let it
          # take the job down; any partial progress it wrote is still worth
          # committing.
          if "$OTS" upgrade entropylab.html.ots; then
            echo "Timestamp complete."
          else
            echo "Proof is still pending a Bitcoin attestation; retrying on the next run."
          fi
          rm -f entropylab.html.ots.bak
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add entropylab.html.ots
          if git diff --cached --quiet; then
            echo "Proof unchanged (still pending, or already complete)."
            exit 0
          fi
          git commit -m "Upgrade OpenTimestamps proof for entropylab.html [skip ci]"
          echo "committed=true" >> "$GITHUB_OUTPUT"
      # A step of its own, so the OTS client never runs while the push token
      # is in reach.
      - name: Push the proof
        if: steps.upgrade.outputs.committed == 'true'
        env:
          PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          # Push with the maintainer token: rock is protected, and required
          # status checks reject direct pushes from GITHUB_TOKEN (an admin
          # token bypasses while enforce_admins is off). The token goes on
          # the command line, which outranks every config file.
          git -c http.https://github.com/.extraheader=             -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(echo -n x-access-token:$PUSH_TOKEN | base64)"             push
