name: Deploy EntropyLab to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Verify committed build output is reproducible
        run: |
          if [ -n "$(git status --porcelain -- index.html versions.json 'entropylab-*.html')" ]; then
            echo "Build output differs from the committed files."
            echo "Run 'npm run build' and commit the result."
            git status --porcelain -- index.html versions.json 'entropylab-*.html'
            exit 1
          fi

      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html entropylab-*.html versions.json _site/
          cp -r assets _site/assets
          touch _site/.nojekyll

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
