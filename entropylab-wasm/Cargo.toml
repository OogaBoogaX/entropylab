[package]
name = "entropylab-wasm"
version = "0.1.0"
edition = "2021"
publish = false
license = "Unlicense AND MIT"
description = "WebAssembly bindings to libsecp256k1, bitcoin_hashes, rust-bitcoin, rust-bip39, base58ck, bech32, scrypt, and a vendored AEZ v5 (for aezeed) for EntropyLab (built by CI, committed as src/js/entropylab-wasm-b64.js)"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Exact versions, lockfile-committed, per CONTRIBUTING.md §2. `secp256k1` is
# the safe rust-bitcoin wrapper over bitcoin-core/secp256k1 (the C sources are
# vendored by secp256k1-sys and build with clang). "lowmemory" shrinks the
# precomputed EC tables baked into the WASM data segment (~1.1 MB ->
# negligible); signing speed is irrelevant for a calculator. No rand features:
# this library never generates randomness. "recovery" exposes ECDSA public
# key recovery, which the BOLT11 invoice decoder needs to recover the payee
# node id from the invoice signature.
secp256k1 = { version = "=0.29.1", default-features = false, features = ["std", "lowmemory", "recovery"] }
bitcoin_hashes = { version = "=0.14.101", default-features = false, features = ["alloc"] }
# rust-bitcoin proper: BIP32 extended keys (bitcoin::bip32). default-features
# are off so no rand/serde/recovery code is compiled in.
bitcoin = { version = "=0.32.11", default-features = false, features = ["std", "secp-lowmemory"] }
# rust-bitcoin ecosystem BIP39 (English wordlist only). No features: NFKD
# normalization is done JS-side (String.normalize, exactly as the previous
# implementation did), so the unicode-normalization tables stay out of the
# artifact.
bip39 = { version = "=2.2.2", default-features = false }
# rust-miniscript: output descriptors (BIP380-386, BIP389 multipath) and the
# multi/sortedmulti/multi_a multisig fragments. Taproot sortedmulti_a is
# layered on top in src/descriptor.rs (derived, sorted as x-only bytes, and
# rewritten to the multi_a it denotes).
miniscript = { version = "=13.1.0", default-features = false, features = ["std"] }
base58ck = { version = "=0.1.101", default-features = false, features = ["std"] }
# rust-bitcoin's bech32 crate, used directly for the word-level bech32m the
# BIP352 silent-payment code needs (extended length limit).
bech32 = { version = "=0.11.1", default-features = false, features = ["alloc"] }
# RustCrypto scrypt (RFC 7914), the KDF of LND's aezeed cipher seed.
# default-features off drops the password-hashing "simple" API; only the raw
# scrypt() function ships.
scrypt = { version = "=0.12.0", default-features = false }
# RustCrypto primitives for the vendored AEZ v5 module (src/aez/, the
# wide-block cipher of LND's aezeed cipher seed; see src/aez/mod.rs for
# provenance): "hazmat" exposes the single AES round the AEZ construction is
# built from, blake2 is the AEZ key-extraction hash, constant_time_eq checks
# the authentication block.
aes = { version = "=0.8.4", default-features = false, features = ["hazmat"] }
blake2 = { version = "=0.10.6", default-features = false }
constant_time_eq = { version = "=0.4.2", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
